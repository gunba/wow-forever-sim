name: Build and Deploy
on:
  push:
    branches:
      - forever
  workflow_dispatch:

# Upstream deploys to wowsims/pages-deploy with a token forks do not have, so this
# publishes to the repository's own Github Pages instead.
#
# The site is served from a subdirectory (/classic), and on a project page that sits
# under the repository name as well, so the prefix is a build input rather than
# something hard-coded. SITE_BASE defaults to /classic/ everywhere - the makefile, the
# vite config and the TypeScript all read it from one place - which is exactly what
# upstream serves, so nothing here changes their build. Set the SITE_BASE repository
# variable to override it; otherwise it is derived from the repository name.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Protoc Go plugin
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve the site base
        id: base
        run: echo "value=${SITE_BASE:-/${{ github.event.repository.name }}/classic/}" >> "$GITHUB_OUTPUT"
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}

      - name: Resolve the site repository
        id: repo
        run: echo "value=${SITE_REPO:-${{ github.repository }}}" >> "$GITHUB_OUTPUT"
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}

      - name: Build 🔧
        run: make dist/classic/.dirstamp
        env:
          SITE_BASE: ${{ steps.base.outputs.value }}
          SITE_REPO: ${{ steps.repo.outputs.value }}

      - name: Test
        run: |
          go test -tags with_db ./tools/forever_bench ./sim/core ./sim/druid ./sim/warlock ./tools/database ./tools/database/gen_db ./tools/icons
          go test -tags with_db ./tools/forever_tanks ./sim/warrior/dps_warrior ./sim/warrior/tank_warrior ./sim/paladin/protection
          go test -tags with_db ./sim -run 'Test(EveryRegisteredSpellSaysWhereItsNumbersCameFrom|EverySpellRegistrationResolvesToAnID|SpellSourcesAreWellFormed|UnreviewedSpellsOnlyShrink|SpellSourceScannerKeepsBranchesAndRejectsRankScalars|SpellSourceScannerFollowsTypedRangeParameter)$'
          python3 -m unittest discover -s tools/forever_bench
          python3 tools/forever_bench/uncertainties.py --check
          python3 -m unittest discover -s tools/database
          python3 -m unittest discover -s tools/data_watch
          node_modules/.bin/esbuild ui/scrub/scrub.test.ts --bundle --platform=node --outfile=/tmp/forever-scrub-test.cjs
          node /tmp/forever-scrub-test.cjs

      - name: Stage benchmark review portal
        run: |
          python3 tools/forever_bench/build_review_site.py \
            --results artifacts/modelled_gear/forever_dps_5min.json \
            --profiles artifacts/modelled_gear/ui_profiles \
            --sensitivity artifacts/modelled_gear/forever_sensitivity.json \
            --gear-search artifacts/modelled_gear_search/current

      # The Go tests and tsc both pass on a build whose pages throw at load, which has
      # shipped a blank site twice. Open every page before it is deployed.
      - name: Install a browser for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Open every page
        run: |
          mkdir -p "site$(dirname "$SITE_BASE")"
          ln -s "$PWD/dist/classic" "site${SITE_BASE%/}"
          python3 -m http.server 8080 --directory site >/dev/null 2>&1 &
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_pages.mjs
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_questions.mjs
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_scrub.mjs
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_icons.mjs
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_benchmark_replay.mjs
          SITE_URL="http://localhost:8080$SITE_BASE" node tools/smoke/check_ranked_defaults.mjs
          go build -tags with_db -o /tmp/forever-tank-bench ./tools/forever_tanks
          SITE_URL="http://localhost:8080$SITE_BASE" TANK_BENCH=/tmp/forever-tank-bench node tools/smoke/check_tank_defaults.mjs
        env:
          SITE_BASE: ${{ steps.base.outputs.value }}

      - name: Add the root redirect
        run: cp deploy/root_index.html dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Github Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
