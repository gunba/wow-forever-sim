syntax = "proto3";
package proto;

option go_package = "./proto";

import "common.proto";

message PriestTalents {
	// Discipline
	int32 power_in_light = 1;
	int32 wand_specialization = 2;
	int32 twin_disciplines = 3;
	int32 silent_resolve = 4;
	int32 holy_precision = 5;
	int32 mental_strength = 12;
	int32 martyrdom = 7;
	int32 mental_agility = 8;
	bool inner_focus = 9;
	int32 improved_power_word_shield = 6;
	int32 meditation = 10;
	int32 improved_inner_fire = 11;
	int32 improved_mana_burn = 14;
	bool soul_warding = 13;
	bool penance = 15;
	int32 renewed_hope = 16;
	int32 divine_aegis = 17;
	bool power_infusion = 18;

	// Holy
	int32 twilight_focus = 19;
	int32 improved_renew = 20;
	int32 holy_specialization = 21;
	int32 spell_warding = 22;
	int32 divine_fury = 23;
	bool holy_nova = 24;
	int32 blessed_recovery = 25;
	int32 inspiration = 26;
	int32 holy_reach = 27;
	int32 improved_healing = 28;
	int32 searing_light = 29;
	bool binding_heal = 30;
	int32 litany_of_light = 31;
	bool spirit_of_redemption = 32;
	int32 spiritual_guidance = 33;
	int32 spiritual_healing = 34;
	bool prayer_of_mending = 35;

	// Shadow Magic
	int32 shadow_focus = 36;
	int32 blackout = 37;
	int32 spirit_tap = 38;
	int32 improved_mind_blast = 42;
	int32 improved_shadow_word_pain = 40;
	int32 shadow_reach = 41;
	int32 improved_psychic_scream = 43;
	bool mind_flay = 44;
	int32 improved_mind_flay = 45;
	int32 dark_inspiration = 54;
	bool vampiric_embrace = 47;
	int32 shadow_weaving = 48;
	bool silence = 49;
	int32 devouring_contagion = 50;
	int32 early_demise = 51;
	int32 darkness = 52;
	bool shadowform = 53;

	reserved 39, 46;
}

message ShadowPriest {
	message Rotation {
	}

	message Options {
		enum Armor {
			NoArmor = 0;
			InnerFire = 1;
		}

		bool use_shadowfiend = 1;
		Armor armor = 2;
		bool use_mind_blast = 4;
		UnitReference power_infusion_target = 5;
		double latency = 6 [deprecated = true]; // Latency between actions
	}
	Options options = 3;
}

// Forever's holy damage build: Smite and Holy Fire carried by Power in Light and
// Searing Light, rather than Shadowform and dots.
message SmitePriest {
	message Rotation {
	}

	message Options {
		enum Armor {
			NoArmor = 0;
			InnerFire = 1;
		}

		Armor armor = 1;
		UnitReference power_infusion_target = 2;
	}
	Options options = 3;
}

message HealingPriest {
	message Rotation {
	}

	message Options {
		bool use_inner_fire = 2;
		UnitReference power_infusion_target = 1;
	}
	Options options = 3;
}
